function showModal(plot){modalHeader.innerHTML=`<h3>VR Devaiah Enclave</h3><div class="plot-num">Plot ${plot.num}</div>`;let pills=`<span class="pill">${plot.dim}</span><span class="pill">${plot.facing}</span>`;const sqft=Math.round(plot.area*10.7639);if(sqft>0)pills+=`<span class="pill">${sqft} sq ft</span>`;modalBody.innerHTML=`<div class="status-badge status-${plot.status}">${plot.status.toUpperCase()}</div><div class="detail-row"><div class="detail-label">Details</div><div>${pills}</div></div><button class="cta-btn" onclick="contactWhatsApp('Plot ${plot.num}')">💬 Get More Info</button>`;modal.classList.add('open');setTimeout(()=>{modalCard.scrollTop=0},50)}
function contactWhatsApp(plot){const msg=`Hi, I'm interested in ${plot} at VR Devaiah Enclave. Can you provide more details?`;window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank')}
function updateTransform(){scene.style.transform=`translate(${state.x}px,${state.y}px) scale(${state.scale})`;zoomDisplay.textContent=Math.round(state.scale*100)+'%'}
function zoom(factor,cx=viewport.offsetWidth/2,cy=viewport.offsetHeight/2){const oldScale=state.scale;state.scale=Math.max(.3,Math.min(3,state.scale*factor));if(cx!==undefined&&cy!==undefined){const scaleChange=state.scale/oldScale;state.x+=cx*(1-scaleChange);state.y+=cy*(1-scaleChange)}updateTransform()}
searchInput.addEventListener('input',e=>{state.search=e.target.value;render()});
statusFilter.addEventListener('change',e=>{state.status=e.target.value;render()});
sizeFilter.addEventListener('change',e=>{state.size=e.target.value;render()});
zoomInBtn?.addEventListener('click',()=>zoom(1.2));
zoomOutBtn?.addEventListener('click',()=>zoom(1/1.2));
zoomResetBtn?.addEventListener('click',()=>{fitSVG();render()});
overlayZoomIn?.addEventListener('click',()=>zoom(1.2));
overlayZoomOut?.addEventListener('click',()=>zoom(1/1.2));
overlayZoomReset?.addEventListener('click',()=>{fitSVG();render()});
viewport.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1,e.clientX,e.clientY)},{passive:false});
viewport.addEventListener('pointerdown',e=>{const target=e.target;if(target.closest('.bottom-sheet, .modal, button, input, select'))return;dragState={sx:state.x,sy:state.y,x:e.clientX,y:e.clientY};viewport.classList.add('dragging');overlayControls.classList.add('show')});
viewport.addEventListener('pointermove',e=>{if(!dragState)return;state.x=dragState.sx+(e.clientX-dragState.x);state.y=dragState.sy+(e.clientY-dragState.y);updateTransform()});
viewport.addEventListener('pointerup',()=>{dragState=null;viewport.classList.remove('dragging')});
viewport.addEventListener('pointerleave',()=>{dragState=null;viewport.classList.remove('dragging');overlayControls.classList.remove('show')});
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
modalCloseBtn.addEventListener('click',closeModal);
function closeModal(){modal.classList.remove('open');state.selected=null;render()}
contactBtn.addEventListener('click',()=>contactWhatsApp('VR Devaiah Enclave'));
window.addEventListener('resize',()=>{state.vw=window.innerWidth;state.vh=window.innerHeight;fitSVG();render()});
loadSVG();
  </script>
</body>
</html>
